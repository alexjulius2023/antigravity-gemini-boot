<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Antigravity Gemini Neko Boot</title>
<style>
  :root {
    --bg-void: #070913;
    --cyan: #60efff;
    --blue: #6b8aff;
    --violet: #a855f7;
    --rose: #f472b6;
    --gold: #fbbf24;
    --text-main: #f3f6ff;
    --text-dim: rgba(203, 213, 245, 0.74);
    --glass: rgba(12, 16, 36, 0.62);
    --border: rgba(148, 175, 255, 0.24);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-void);
    color: var(--text-main);
    font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    cursor: pointer;
  }

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 66% 48%, rgba(92, 68, 214, 0.22) 0%, rgba(16, 20, 48, 0.10) 44%, rgba(7, 9, 19, 1) 78%),
      var(--bg-void);
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), filter 0.45s ease;
    will-change: transform, filter, opacity;
  }

  #stage.handoff {
    transform: scale(1.055);
    filter: brightness(1.18);
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #bgCanvas   { z-index: 1; }
  #heroGl     { z-index: 3; }
  #fxCanvas   { z-index: 6; }

  /* Perspective Star-Grid Floor */
  .star-grid {
    position: absolute;
    left: -22%;
    right: -22%;
    bottom: -36%;
    height: 62%;
    z-index: 2;
    background-image:
      linear-gradient(rgba(96, 239, 255, 0.11) 1px, transparent 1px),
      linear-gradient(90deg, rgba(168, 85, 247, 0.13) 1px, transparent 1px);
    background-size: 62px 62px;
    transform: perspective(680px) rotateX(68deg);
    mask-image: radial-gradient(ellipse 70% 74% at 50% 35%, rgba(0,0,0,0.88) 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse 70% 74% at 50% 35%, rgba(0,0,0,0.88) 0%, transparent 78%);
    opacity: 0;
    animation: gridWake 1.2s ease-out 0.3s forwards, gridDrift 11s linear infinite;
  }

  @keyframes gridWake { to { opacity: 0.78; } }
  @keyframes gridDrift {
    from { background-position: 0 0; }
    to   { background-position: 0 124px; }
  }

  /* =========================================================
     ACT 1 (0.0s - 1.75s): Gemini Star Singularity Ignition
     ========================================================= */
  .singularity {
    position: absolute;
    inset: 0;
    z-index: 9;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .singularity-star {
    width: 146px;
    height: 146px;
    opacity: 0;
    transform: scale(0.1) rotate(-75deg);
    filter: drop-shadow(0 0 34px rgba(96, 239, 255, 0.95)) drop-shadow(0 0 76px rgba(168, 85, 247, 0.92));
    animation: starIgnite 1.72s cubic-bezier(0.16, 1, 0.3, 1) 0.06s forwards;
  }

  @keyframes starIgnite {
    0%   { opacity: 0; transform: scale(0.10) rotate(-75deg); }
    40%  { opacity: 1; transform: scale(1.25) rotate(0deg); }
    72%  { opacity: 1; transform: scale(0.88) rotate(32deg); }
    100% { opacity: 0; transform: scale(3.5) rotate(115deg); }
  }

  .shockwave {
    position: absolute;
    width: 136px;
    height: 136px;
    border-radius: 50%;
    border: 2.5px solid rgba(96, 239, 255, 0.9);
    box-shadow: 0 0 48px rgba(168, 85, 247, 0.85), inset 0 0 34px rgba(244, 114, 182, 0.65);
    opacity: 0;
    transform: scale(0.12);
    animation: shockExpand 1.55s cubic-bezier(0.12, 0.85, 0.22, 1) 0.55s forwards;
  }
  .shockwave.second {
    border-color: rgba(244, 114, 182, 0.85);
    box-shadow: 0 0 42px rgba(251, 191, 36, 0.72);
    animation-delay: 0.78s;
  }

  @keyframes shockExpand {
    0%   { opacity: 0.95; transform: scale(0.18); }
    100% { opacity: 0; transform: scale(13.5); border-width: 0.5px; }
  }

  /* =========================================================
     ACT 2 (1.65s - 4.15s): Anime Heterochromia Awakening Cut-In
     ========================================================= */
  .cutin-layer {
    position: fixed;
    inset: 0;
    z-index: 11;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    animation: cutinVisibility 2.58s linear 1.62s forwards;
  }

  @keyframes cutinVisibility {
    0%   { opacity: 0; }
    5%   { opacity: 1; }
    90%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .cutin-band {
    position: relative;
    width: 118vw;
    height: clamp(250px, 37vh, 390px);
    transform: rotate(-5.0deg) scaleY(0.04);
    overflow: hidden;
    background: #090b18;
    border-top: 2.5px solid rgba(96, 239, 255, 0.92);
    border-bottom: 2.5px solid rgba(244, 114, 182, 0.92);
    box-shadow:
      0 0 58px rgba(168, 85, 247, 0.75),
      0 0 115px rgba(96, 239, 255, 0.36),
      inset 0 0 40px rgba(7, 9, 19, 0.85);
    animation: cutinSlam 2.50s cubic-bezier(0.16, 1, 0.3, 1) 1.65s forwards;
    will-change: transform, opacity;
  }

  @keyframes cutinSlam {
    0%   { transform: rotate(-5.0deg) scaleY(0.03) translateX(-14%); opacity: 0; }
    11%  { transform: rotate(-5.0deg) scaleY(1.05) translateX(0%); opacity: 1; }
    18%  { transform: rotate(-5.0deg) scaleY(1.00) translateX(0%); opacity: 1; }
    88%  { transform: rotate(-5.0deg) scaleY(1.00) translateX(0%); opacity: 1; }
    100% { transform: rotate(-5.0deg) scaleY(0.02) translateX(18%); opacity: 0; }
  }

  .cutin-img {
    position: absolute;
    inset: -8% -4%;
    width: 108%;
    height: 116%;
    object-fit: cover;
    object-position: 50% 42%;
    transform: scale(1.16) translateX(-3%);
    filter: contrast(1.08) saturate(1.14);
    animation: cutinPan 2.48s cubic-bezier(0.12, 0.65, 0.25, 1) 1.66s forwards;
  }

  @keyframes cutinPan {
    0%   { transform: scale(1.24) translateX(-4.5%); filter: brightness(1.6) contrast(1.14); }
    18%  { transform: scale(1.10) translateX(-1.5%); filter: brightness(1.06) contrast(1.08); }
    86%  { transform: scale(1.02) translateX(2.0%);  filter: brightness(1.04) contrast(1.08); }
    100% { transform: scale(1.16) translateX(5.5%);  filter: brightness(1.85) contrast(1.2); }
  }

  .cutin-glint {
    position: absolute;
    inset: 0;
    background: linear-gradient(108deg,
      transparent 20%,
      rgba(96, 239, 255, 0.32) 44%,
      rgba(255, 255, 255, 0.72) 50%,
      rgba(244, 114, 182, 0.36) 56%,
      transparent 80%);
    transform: translateX(-110%);
    animation: cutinSweep 1.25s ease-out 2.05s forwards;
    mix-blend-mode: screen;
  }

  @keyframes cutinSweep {
    to { transform: translateX(120%); }
  }

  .cutin-caption {
    position: absolute;
    left: 6vw;
    top: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 18px;
    border-radius: 6px;
    background: rgba(7, 9, 22, 0.84);
    border-left: 3.5px solid var(--rose);
    border-right: 3.5px solid var(--gold);
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
  }

  .cutin-caption .kicker {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.24em;
    color: var(--cyan);
  }

  .cutin-caption .jp-cn {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.14em;
    background: linear-gradient(90deg, #fff, #f9a8d4, #fde68a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* =========================================================
     ACT 3 & 4 (2.35s - 6.2s): Neon Trace -> WebGL Live2D Hero
     ========================================================= */
  .hero-stage {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
  }

  .hero-aura {
    position: absolute;
    right: 4%;
    top: 4%;
    width: 64%;
    height: 90%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 46% 34%, rgba(244, 114, 182, 0.24) 0%, transparent 42%),
      radial-gradient(circle at 60% 32%, rgba(251, 191, 36, 0.18) 0%, transparent 40%),
      radial-gradient(circle at 52% 52%, rgba(124, 92, 255, 0.30) 0%, rgba(56, 189, 248, 0.14) 46%, transparent 74%);
    filter: blur(46px);
    opacity: 0;
    animation: auraBloom 1.6s ease-out 4.35s forwards, auraPulse 4.2s ease-in-out 5.95s infinite;
  }

  @keyframes auraBloom { to { opacity: 1; } }
  @keyframes auraPulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.09); opacity: 1; }
  }

  /* Live2D WebGL Canvas Reveal Container */
  #heroRevealWrap {
    position: absolute;
    inset: 0;
    z-index: 3;
    opacity: 0;
    clip-path: polygon(110% 0, 125% 0, 105% 100%, 95% 100%);
    animation: colorAwaken 1.45s cubic-bezier(0.16, 1, 0.3, 1) 4.85s forwards;
  }

  @keyframes colorAwaken {
    0% {
      opacity: 0.25;
      filter: brightness(1.65) saturate(1.3);
      clip-path: polygon(115% 0, 132% 0, 106% 100%, 96% 100%);
    }
    55% {
      opacity: 1;
      filter: brightness(1.18) saturate(1.12);
    }
    100% {
      opacity: 1;
      filter: brightness(1.0) saturate(1.04);
      clip-path: polygon(-12% 0, 100% 0, 100% 100%, -12% 100%);
    }
  }

  /* Fallback static img (only visible if WebGL unavailable) */
  #heroFallback {
    display: none;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 62% center;
    mask-image: radial-gradient(ellipse 78% 82% at 64% 50%, #000 52%, transparent 94%);
    -webkit-mask-image: radial-gradient(ellipse 78% 82% at 64% 50%, #000 52%, transparent 94%);
  }

  /* Neon Blueprint Trace Overlay */
  #heroNeon {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 62% center;
    z-index: 4;
    opacity: 0;
    mix-blend-mode: screen;
    filter: drop-shadow(0 0 14px rgba(96, 239, 255, 0.82));
    mask-image: radial-gradient(ellipse 78% 82% at 64% 50%, #000 52%, transparent 94%);
    -webkit-mask-image: radial-gradient(ellipse 78% 82% at 64% 50%, #000 52%, transparent 94%);
    clip-path: inset(0 0 100% 0);
    animation:
      neonTrace 1.35s cubic-bezier(0.22, 0.9, 0.35, 1) 3.95s forwards,
      neonFade 1.15s ease-out 5.30s forwards;
  }

  @keyframes neonTrace {
    0%   { opacity: 0.96; clip-path: inset(0 0 100% 0); }
    100% { opacity: 1;    clip-path: inset(0 0 0% 0); }
  }
  @keyframes neonFade {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  .scan-beam {
    position: absolute;
    top: -10%;
    bottom: -10%;
    right: -14%;
    width: 168px;
    z-index: 5;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(96, 239, 255, 0.55) 35%,
      rgba(255, 255, 255, 0.95) 50%,
      rgba(244, 114, 182, 0.62) 68%,
      transparent 100%);
    transform: skewX(-16deg);
    filter: blur(8px);
    opacity: 0;
    animation: beamSweep 1.45s cubic-bezier(0.16, 1, 0.3, 1) 4.85s forwards;
  }

  @keyframes beamSweep {
    0%   { opacity: 0; right: -8%; }
    18%  { opacity: 0.98; }
    82%  { opacity: 0.72; }
    100% { opacity: 0; right: 114%; }
  }

  /* =========================================================
     Left Kinetic Identity & Telemetry HUD
     ========================================================= */
  .hud-left {
    position: absolute;
    left: clamp(36px, 5.6vw, 96px);
    top: 50%;
    transform: translateY(-50%);
    width: min(510px, 42vw);
    z-index: 8;
    display: flex;
    flex-direction: column;
    gap: 18px;
    transition: transform 0.25s ease-out;
  }

  .badge-row {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    width: fit-content;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(16, 22, 48, 0.76);
    border: 1px solid rgba(147, 197, 253, 0.32);
    backdrop-filter: blur(12px);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: #cde0ff;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) 5.25s forwards;
  }

  .eye-dots { display: inline-flex; align-items: center; gap: 5px; }
  .eye-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: eyeGlow 2.2s ease-in-out infinite;
  }
  .eye-dot.pink {
    background: var(--rose);
    box-shadow: 0 0 11px var(--rose), 0 0 20px rgba(244, 114, 182, 0.8);
  }
  .eye-dot.gold {
    background: var(--gold);
    box-shadow: 0 0 11px var(--gold), 0 0 20px rgba(251, 191, 36, 0.8);
    animation-delay: 0.45s;
  }

  @keyframes eyeGlow {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.32); opacity: 1; }
  }

  .brand-wrap { display: flex; flex-direction: column; gap: 10px; }
  .brand-line { display: flex; align-items: center; gap: 14px; }

  .brand-star {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    opacity: 0;
    transform: scale(0.25) rotate(-110deg);
    filter: drop-shadow(0 0 18px rgba(107, 138, 255, 0.95));
    animation: brandStarIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) 5.42s forwards;
  }

  @keyframes brandStarIn {
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .brand-title {
    display: flex;
    font-size: clamp(32px, 3.7vw, 56px);
    font-weight: 800;
    letter-spacing: 0.08em;
    line-height: 1;
    background: linear-gradient(105deg, #ffffff 8%, #9be7ff 38%, #c084fc 68%, #f9a8d4 92%, #fde68a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 24px rgba(124, 92, 255, 0.42));
  }

  .brand-title .char {
    display: inline-block;
    opacity: 0;
    transform: translateY(22px) scale(0.84);
    animation: charRise 0.56s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    background: inherit;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  @keyframes charRise {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .subtitle {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.22em;
    color: rgba(165, 208, 255, 0.88);
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.72s ease-out 6.08s forwards;
  }

  .greeting {
    font-size: 16px;
    font-weight: 400;
    color: rgba(240, 245, 255, 0.90);
    letter-spacing: 0.05em;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.72s ease-out 6.28s forwards;
  }

  /* 3-View Holographic Calibration Strip with Animated Scanline */
  .views-strip {
    display: flex;
    gap: 11px;
    margin-top: 4px;
    opacity: 0;
    transform: translateY(14px);
    animation: fadeUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) 6.42s forwards;
  }

  .view-card {
    position: relative;
    width: 82px;
    height: 98px;
    border-radius: 12px;
    background: linear-gradient(160deg, rgba(24, 30, 66, 0.78), rgba(10, 13, 30, 0.85));
    border: 1px solid rgba(139, 165, 255, 0.24);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 4px 18px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.38);
    transition: border-color 0.35s ease, box-shadow 0.35s ease, transform 0.35s ease;
  }

  .view-card::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    top: -10%;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--rose), transparent);
    box-shadow: 0 0 10px var(--cyan);
    opacity: 0;
  }

  .view-card.synced {
    border-color: rgba(168, 85, 247, 0.70);
    box-shadow: 0 0 22px rgba(168, 85, 247, 0.34);
    transform: translateY(-2px);
  }

  .view-card.synced::after {
    opacity: 0.9;
    animation: miniScan 1.8s ease-in-out infinite;
  }

  @keyframes miniScan {
    0%   { top: 0%; opacity: 0.1; }
    50%  { opacity: 0.95; }
    100% { top: 96%; opacity: 0.1; }
  }

  .view-card img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 7px rgba(107, 138, 255, 0.45));
  }

  .view-label {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 3px;
    text-align: center;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: rgba(206, 222, 255, 0.80);
  }

  /* Live Boot Telemetry Card */
  .telemetry {
    margin-top: 4px;
    padding: 15px 17px;
    border-radius: 14px;
    background: var(--glass);
    border: 1px solid var(--border);
    backdrop-filter: blur(14px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
    transform: translateY(14px);
    animation: fadeUp 0.72s ease-out 6.62s forwards;
    box-shadow: 0 14px 38px rgba(0, 0, 0, 0.42);
  }

  .telemetry-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  #statusText { color: #ebf2ff; font-weight: 500; letter-spacing: 0.03em; }
  #percentText {
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 12.5px;
    color: var(--cyan);
    font-weight: 700;
  }

  .progress-track {
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.09);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--cyan), var(--blue), var(--violet), var(--rose), var(--gold));
    background-size: 200% 100%;
    box-shadow: 0 0 16px rgba(107, 138, 255, 0.9);
    transition: width 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    animation: shimmerBar 2.0s linear infinite;
  }

  @keyframes shimmerBar {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  .telemetry-meta {
    display: flex;
    justify-content: space-between;
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 10.5px;
    color: rgba(176, 194, 240, 0.68);
  }

  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

  /* Real Window Lock-On Targeting Frame */
  #lockFrame {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 12;
    pointer-events: none;
    opacity: 0;
    border: 2px solid rgba(96, 239, 255, 0.78);
    box-shadow:
      0 0 34px rgba(168, 85, 247, 0.62),
      inset 0 0 42px rgba(96, 239, 255, 0.24);
    border-radius: 10px;
    transition:
      left 0.36s cubic-bezier(0.16, 1, 0.3, 1),
      top 0.36s cubic-bezier(0.16, 1, 0.3, 1),
      width 0.36s cubic-bezier(0.16, 1, 0.3, 1),
      height 0.36s cubic-bezier(0.16, 1, 0.3, 1),
      opacity 0.25s ease;
  }
  #lockFrame.active { opacity: 1; }

  .lock-tag {
    position: absolute;
    top: 12px;
    right: 16px;
    padding: 5px 12px;
    border-radius: 6px;
    background: rgba(8, 12, 28, 0.86);
    border: 1px solid rgba(96, 239, 255, 0.52);
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 11px;
    color: var(--cyan);
    letter-spacing: 0.08em;
  }

  /* Final Star-Gate Portal Bloom */
  #handoffFlash {
    position: fixed;
    inset: 0;
    z-index: 14;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle at 50% 50%,
      rgba(255, 255, 255, 0.52) 0%,
      rgba(168, 85, 247, 0.30) 34%,
      rgba(96, 239, 255, 0.16) 58%,
      transparent 82%);
    transition: opacity 0.28s ease-out;
  }
  #handoffFlash.bloom { opacity: 1; }

  .skip-hint {
    position: fixed;
    right: 26px;
    bottom: 20px;
    z-index: 10;
    font-size: 11.5px;
    letter-spacing: 0.12em;
    color: rgba(196, 210, 248, 0.54);
    padding: 6px 13px;
    border-radius: 999px;
    background: rgba(12, 16, 36, 0.50);
    border: 1px solid rgba(148, 175, 255, 0.16);
    opacity: 0;
    animation: fadeUp 0.6s ease 1.1s forwards;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .skip-hint:hover { color: #fff; border-color: rgba(168, 85, 247, 0.62); }

  #replayBtn {
    display: none;
    position: fixed;
    left: 50%;
    top: 50%;

<script>
(function() {
  const params = new URLSearchParams(location.search);
  const soundEnabled = params.get("mute") !== "1";
  const snapshotTime = parseFloat(params.get("snapshot") || "0");
  const soundVolume = Math.min(0.6, Math.max(0.0, parseFloat(params.get("vol") || "0.28")));
  const subtitleParam = params.get("subtitle");
  const greetingParam = params.get("greeting");
  if (subtitleParam) document.getElementById("subtitleText").textContent = subtitleParam;
  if (greetingParam) document.getElementById("greetingText").textContent = greetingParam;

  // Kinetic letter-by-letter title
  const titleEl = document.getElementById("brandTitle");
  const word = "ANTIGRAVITY";
  [...word].forEach((ch, idx) => {
    const span = document.createElement("span");
    span.className = "char";
    span.textContent = ch;
    span.style.animationDelay = (5.52 + idx * 0.055).toFixed(3) + "s";
    titleEl.appendChild(span);
  });

  // =========================================================================
  // Synthesized 10.5s Ethereal Anime-Opening Audio Motif (Web Audio API)
  // =========================================================================
  function playAnimeOpeningAudio() {
    if (!soundEnabled) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const master = ctx.createGain();
      master.gain.value = soundVolume;
      master.connect(ctx.destination);
      const now = ctx.currentTime;

      // 1. Sub-bass cosmic ignition swell (0.05s - 1.7s)
      const sub = ctx.createOscillator();
      const subG = ctx.createGain();
      sub.type = "sine";
      sub.frequency.setValueAtTime(55, now + 0.05);
      sub.frequency.exponentialRampToValueAtTime(110, now + 1.45);
      subG.gain.setValueAtTime(0.0001, now + 0.05);
      subG.gain.exponentialRampToValueAtTime(0.28, now + 0.55);
      subG.gain.exponentialRampToValueAtTime(0.0001, now + 1.85);
      sub.connect(subG); subG.connect(master);
      sub.start(now + 0.05); sub.stop(now + 1.9);

      // 2. Dramatic Anime Cut-In Shimmer Whoosh (1.65s)
      const cutOsc = ctx.createOscillator();
      const cutG = ctx.createGain();
      cutOsc.type = "triangle";
      cutOsc.frequency.setValueAtTime(220, now + 1.65);
      cutOsc.frequency.exponentialRampToValueAtTime(880, now + 1.92);
      cutOsc.frequency.exponentialRampToValueAtTime(587.33, now + 3.45);
      cutG.gain.setValueAtTime(0.0001, now + 1.65);
      cutG.gain.exponentialRampToValueAtTime(0.23, now + 1.78);
      cutG.gain.exponentialRampToValueAtTime(0.0001, now + 3.65);
      cutOsc.connect(cutG); cutG.connect(master);
      cutOsc.start(now + 1.65); cutOsc.stop(now + 3.7);

      // 3. Crystalline Starlight Arpeggio across Acts 2 - 4 (1.85s - 9.2s)
      const notes = [
        { f: 293.66, t: 1.82, d: 1.9, g: 0.14, type: "sine" },
        { f: 440.00, t: 2.05, d: 1.9, g: 0.13, type: "triangle" },
        { f: 587.33, t: 2.30, d: 2.0, g: 0.13, type: "sine" },
        { f: 659.25, t: 2.60, d: 2.1, g: 0.12, type: "sine" },
        { f: 739.99, t: 4.00, d: 2.2, g: 0.13, type: "sine" },
        { f: 880.00, t: 4.35, d: 2.3, g: 0.14, type: "triangle" },
        { f: 1108.73, t: 4.85, d: 2.5, g: 0.14, type: "sine" },
        { f: 1174.66, t: 5.15, d: 2.6, g: 0.15, type: "sine" },
        { f: 1318.51, t: 5.55, d: 2.6, g: 0.11, type: "triangle" },
        { f: 1479.98, t: 6.15, d: 2.5, g: 0.10, type: "sine" },
        { f: 1760.00, t: 7.20, d: 2.3, g: 0.08, type: "sine" },
        { f: 1479.98, t: 8.15, d: 2.1, g: 0.07, type: "triangle" }
      ];
      for (const n of notes) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = n.type;
        osc.frequency.setValueAtTime(n.f, now + n.t);
        g.gain.setValueAtTime(0.0001, now + n.t);
        g.gain.exponentialRampToValueAtTime(n.g, now + n.t + 0.06);
        g.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.d);
        osc.connect(g); g.connect(master);
        osc.start(now + n.t); osc.stop(now + n.t + n.d + 0.06);
      }

      // Soft warm evolving cosmic pad chord under Act 4 Live2D Showcase
      [293.66, 369.99, 440.00, 554.37].forEach((freq) => {
        const pad = ctx.createOscillator();
        const pg = ctx.createGain();
        pad.type = "sine";
        pad.frequency.setValueAtTime(freq, now + 4.8);
        pg.gain.setValueAtTime(0.0001, now + 4.8);
        pg.gain.exponentialRampToValueAtTime(0.055, now + 5.8);
        pg.gain.exponentialRampToValueAtTime(0.0001, now + 10.2);
        pad.connect(pg); pg.connect(master);
        pad.start(now + 4.8); pad.stop(now + 10.3);
      });
    } catch (_) {}
  }

  function playHandoffPing() {
    if (!soundEnabled) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1760, now + 0.24);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(soundVolume * 0.36, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.45);
    } catch (_) {}
  }

  if (snapshotTime <= 0) setTimeout(playAnimeOpeningAudio, 60);

  // =========================================================================
  // REAL-TIME WEBGL LIVE2D ANIMATED GEMINI CATGIRL SHADER
  // Anatomically targeted deformation:
  //   - Flowing zero-gravity long hair billows (left & right)
  //   - Lively swaying fluffy cat tail
  //   - Periodic cute cat-ear twitches & bouncy ahoge curl
  //   - Natural procedural eyelid blinking + heterochromia eye sparkles
  //   - Weightless silk crescent ribbon waves & rhythmic breathing
  //   - Interactive 3D mouse parallax
  // =========================================================================
  const heroGlCanvas = document.getElementById("heroGl");
  const heroFallback = document.getElementById("heroFallback");
  let gl = null;
  let glReady = false;
  let glProg = null;
  let glUniforms = {};
  let imgW = 1376, imgH = 768;

  const VERT_SRC = `
    attribute vec2 aPos;
    varying vec2 vScreenUv;
    void main() {
      vScreenUv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5);
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  `;

  const FRAG_SRC = `
    precision highp float;
    varying vec2 vScreenUv;
    uniform sampler2D uTex;
    uniform vec2 uRes;
    uniform vec2 uImgRes;
    uniform float uTime;
    uniform float uBlink;
    uniform float uEarTwitchL;
    uniform float uEarTwitchR;
    uniform vec2 uMouse;

    float gauss(vec2 p, vec2 c, vec2 r) {
      vec2 d = (p - c) / r;
      return exp(-dot(d, d));
    }

    vec2 rot2(vec2 v, float a) {
      float c = cos(a), s = sin(a);
      return vec2(v.x * c - v.y * s, v.x * s + v.y * c);
    }

    void main() {
      // Object-fit: cover anchored at (0.62, 0.50) so composition matches any monitor ratio
      float screenAspect = uRes.x / max(1.0, uRes.y);
      float imgAspect = uImgRes.x / max(1.0, uImgRes.y);
      vec2 uv = vScreenUv;
      if (screenAspect > imgAspect) {
        float scale = imgAspect / screenAspect;
        uv.y = (uv.y - 0.5) * scale + 0.5;
      } else {
        float scale = screenAspect / imgAspect;
        uv.x = (uv.x - 0.62) * scale + 0.62;
      }

      // Global zero-gravity floating levitation + subtle camera push & mouse parallax
      float floatY = sin(uTime * 1.45) * 0.0145 + cos(uTime * 0.85) * 0.005;
      float floatX = sin(uTime * 0.72) * 0.0060;
      float tiltAng = sin(uTime * 0.95) * 0.016 + uMouse.x * 0.014;
      vec2 pivot = vec2(0.66, 0.44);
      uv = rot2(uv - pivot, tiltAng) + pivot;
      uv += vec2(floatX - uMouse.x * 0.016, floatY - uMouse.y * 0.013);

      // Protect her face & facial features from hair/cloth warp
      float faceProtect = gauss(uv, vec2(0.665, 0.215), vec2(0.056, 0.068));
      float nonFace = 1.0 - smoothstep(0.18, 0.72, faceProtect);

      vec2 disp = vec2(0.0);

      // 1. Left long wavy hair billowing weightlessly in zero-G
      float hairL = gauss(uv, vec2(0.545, 0.435), vec2(0.095, 0.165)) * nonFace;
      float waveL1 = sin(uTime * 3.0 + uv.y * 15.0 - uv.x * 9.0);
      float waveL2 = cos(uTime * 2.1 + uv.x * 18.0 + uv.y * 7.0);
      disp += vec2(waveL1 * 0.0145 + waveL2 * 0.0060, waveL2 * 0.0088) * hairL;

      // 2. Right long wavy hair billowing weightlessly in zero-G
      float hairR = gauss(uv, vec2(0.795, 0.385), vec2(0.098, 0.165)) * nonFace;
      float waveR1 = sin(uTime * 2.85 + uv.y * 14.0 + uv.x * 10.0);
      float waveR2 = cos(uTime * 2.0 - uv.x * 16.0 + uv.y * 8.0);
      disp += vec2(waveR1 * 0.0155 + waveR2 * 0.0060, waveR2 * 0.0092) * hairR;

      // 3. Fluffy cat tail lively wagging (bottom center, avoids boots)
      float tailMain = gauss(uv, vec2(0.635, 0.795), vec2(0.065, 0.095));
      float tailTip  = gauss(uv, vec2(0.755, 0.805), vec2(0.048, 0.055));
      float tailMask = clamp(tailMain + tailTip * 0.85, 0.0, 1.0);
      float tailWag = sin(uTime * 3.6 - uv.y * 8.0) * 0.0200 + sin(uTime * 7.2) * 0.004;
      disp += vec2(tailWag, cos(uTime * 3.6) * 0.0090) * tailMask;

      // 4. Cute periodic cat-ear twitches (Left ear: 0.618,0.125 | Right ear: 0.696,0.088)
      float earL = gauss(uv, vec2(0.618, 0.118), vec2(0.032, 0.036));
      float earR = gauss(uv, vec2(0.697, 0.084), vec2(0.032, 0.036));
      disp += vec2(-0.011, 0.015) * earL * uEarTwitchL;
      disp += vec2( 0.012, 0.015) * earR * uEarTwitchR;

      // 5. Bouncy top ahoge hair curl (0.656, 0.065)
      float ahoge = gauss(uv, vec2(0.656, 0.064), vec2(0.025, 0.028));
      disp += vec2(sin(uTime * 4.6) * 0.0115, cos(uTime * 4.6) * 0.0055) * ahoge;

      // 6. Left & right crescent starry ribbons fluttering like cosmic silk
      float ribL = gauss(uv, vec2(0.442, 0.285), vec2(0.055, 0.195));
      float ribR = gauss(uv, vec2(0.912, 0.325), vec2(0.052, 0.185));
      disp += vec2(sin(uTime * 2.5 + uv.y * 11.0) * 0.015, cos(uTime * 2.2 + uv.y * 9.0) * 0.007) * ribL;
      disp += vec2(sin(uTime * 2.6 - uv.y * 11.0) * 0.015, cos(uTime * 2.3 + uv.y * 9.0) * 0.007) * ribR;

      // 7. Gentle chest breathing & torso expansion
      float chest = gauss(uv, vec2(0.655, 0.375), vec2(0.062, 0.078)) * nonFace;
      float breath = sin(uTime * 2.15) * 0.0062;
      disp += (uv - vec2(0.655, 0.375)) * (-breath * 1.55) * chest;

      vec2 sampleUv = uv - disp;

      // 8. Procedural Live2D Eye Blink on BOTH tilted eyes:
      //    Right Eye (Magenta): (0.647, 0.220) | Left Eye (Amber-Gold): (0.684, 0.205)
      float lashShade = 0.0;
      if (uBlink > 0.005) {
        // Right eye (viewer left)
        vec2 e1 = vec2(0.647, 0.219);
        vec2 loc1 = rot2(sampleUv - e1, 0.27);
        vec2 ell1 = loc1 / vec2(0.0145, 0.0155);
        float m1 = smoothstep(1.0, 0.22, length(ell1));
        if (m1 > 0.001) {
          float squash = mix(1.0, 4.4, uBlink);
          vec2 closedLoc1 = vec2(loc1.x, (loc1.y + 0.006 * uBlink) * squash - 0.006 * uBlink);
          closedLoc1.y = clamp(closedLoc1.y, -0.014, 0.012);
          sampleUv = mix(sampleUv, e1 + rot2(closedLoc1, -0.27), m1 * uBlink);
          // Delicate closed eyelash arc
          float arc1 = abs(loc1.y - (0.0015 + loc1.x * loc1.x * 16.0));
          lashShade = max(lashShade, smoothstep(0.0032, 0.0006, arc1) * smoothstep(0.013, 0.007, abs(loc1.x)) * uBlink);
        }

        // Left eye (viewer right)
        vec2 e2 = vec2(0.684, 0.205);
        vec2 loc2 = rot2(sampleUv - e2, 0.27);
        vec2 ell2 = loc2 / vec2(0.0150, 0.0155);
        float m2 = smoothstep(1.0, 0.22, length(ell2));
        if (m2 > 0.001) {
          float squash = mix(1.0, 4.4, uBlink);
          vec2 closedLoc2 = vec2(loc2.x, (loc2.y + 0.006 * uBlink) * squash - 0.006 * uBlink);
          closedLoc2.y = clamp(closedLoc2.y, -0.014, 0.012);
          sampleUv = mix(sampleUv, e2 + rot2(closedLoc2, -0.27), m2 * uBlink);
          float arc2 = abs(loc2.y - (0.0015 + loc2.x * loc2.x * 16.0));
          lashShade = max(lashShade, smoothstep(0.0032, 0.0006, arc2) * smoothstep(0.013, 0.007, abs(loc2.x)) * uBlink);
        }
      }

      vec3 voidCol = vec3(0.0275, 0.0353, 0.0745); // #070913 exact match
      vec3 col = voidCol;
      if (sampleUv.x >= 0.0 && sampleUv.x <= 1.0 && sampleUv.y >= 0.0 && sampleUv.y <= 1.0) {
        col = texture2D(uTex, sampleUv).rgb;
        // Blend delicate dark indigo eyelash line during blink
        col = mix(col, vec3(0.14, 0.11, 0.24), lashShade * 0.85);

        // Subtle luminous heterochromia pulse on eyes when open
        float openAmt = 1.0 - uBlink;
        float eyePinkGlow = gauss(uv, vec2(0.647, 0.219), vec2(0.015, 0.015)) * openAmt;
        float eyeGoldGlow = gauss(uv, vec2(0.684, 0.205), vec2(0.015, 0.015)) * openAmt;
        float shimmer = 0.55 + 0.45 * sin(uTime * 3.8);
        col += vec3(0.96, 0.34, 0.68) * eyePinkGlow * 0.22 * shimmer;
        col += vec3(0.99, 0.76, 0.18) * eyeGoldGlow * 0.22 * shimmer;

        // Subtle shimmering cosmic sheen across hair & star ornaments
        float sheen = sin(uv.x * 16.0 - uv.y * 10.0 - uTime * 3.2) * 0.5 + 0.5;
        float brightMask = smoothstep(0.55, 0.95, max(col.r, max(col.g, col.b)));
        col += vec3(0.28, 0.46, 0.95) * brightMask * pow(sheen, 5.0) * 0.14;
      }

      // Seamless elliptical radial vignette melting dark void edges into #070913
      // without ever dimming her cat ears, ribbons, or boots!
      vec2 vDist = (vScreenUv - vec2(0.64, 0.50)) / vec2(0.50, 0.58);
      float edgeMask = 1.0 - smoothstep(0.76, 1.08, length(vDist));
      float luma = dot(col, vec3(0.299, 0.587, 0.114));
      float fgProtect = smoothstep(0.10, 0.24, luma);
      float alphaMask = max(edgeMask, fgProtect * (1.0 - smoothstep(0.95, 1.18, length(vDist))));
      col = mix(voidCol, col, alphaMask);

      gl_FragColor = vec4(col, alphaMask);
    }
  `;

  function initHeroWebGL() {
    try {
      gl = heroGlCanvas.getContext("webgl", { alpha: true, antialias: true, premultipliedAlpha: true });
      if (!gl) throw new Error("No WebGL");

      const compile = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(s));
        }
        return s;
      };
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT_SRC));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG_SRC));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(prog));
      }
      glProg = prog;
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const aPos = gl.getAttribLocation(prog, "aPos");
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      glUniforms = {
        uTex: gl.getUniformLocation(prog, "uTex"),
        uRes: gl.getUniformLocation(prog, "uRes"),
        uImgRes: gl.getUniformLocation(prog, "uImgRes"),
        uTime: gl.getUniformLocation(prog, "uTime"),
        uBlink: gl.getUniformLocation(prog, "uBlink"),
        uEarTwitchL: gl.getUniformLocation(prog, "uEarTwitchL"),
        uEarTwitchR: gl.getUniformLocation(prog, "uEarTwitchR"),
        uMouse: gl.getUniformLocation(prog, "uMouse"),
      };

      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

      const heroImg = new Image();
      heroImg.crossOrigin = "anonymous";
      heroImg.onload = () => {
        imgW = heroImg.naturalWidth || 1376;
        imgH = heroImg.naturalHeight || 768;
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, heroImg);
        glReady = true;
      };
      heroImg.src = "../assets/gemini_catgirl_hero.jpg";
    } catch (e) {
      // Graceful fallback to static image if WebGL is unavailable
      heroGlCanvas.style.display = "none";
      heroFallback.style.display = "block";
    }
  }
  initHeroWebGL();

  // =========================================================================
  // 2D Canvas: 3D Warp Star Tunnel + Anti-Gravity Dust + Orbiters + Meteors
  // =========================================================================
  const bgCanvas = document.getElementById("bgCanvas");
  const fxCanvas = document.getElementById("fxCanvas");
  const bgCtx = bgCanvas.getContext("2d");
  const fxCtx = fxCanvas.getContext("2d");
  const hudLeft = document.getElementById("hudLeft");

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    bgCanvas.width = Math.floor(W * DPR);
    bgCanvas.height = Math.floor(H * DPR);
    fxCanvas.width = Math.floor(W * DPR);
    fxCanvas.height = Math.floor(H * DPR);
    heroGlCanvas.width = Math.floor(W * DPR);
    heroGlCanvas.height = Math.floor(H * DPR);
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fxCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (gl) gl.viewport(0, 0, heroGlCanvas.width, heroGlCanvas.height);
  }
  resize();
  window.addEventListener("resize", resize);

  // Interactive smooth mouse parallax
  let targetMouseX = 0, targetMouseY = 0, mouseX = 0, mouseY = 0;
  window.addEventListener("mousemove", (e) => {
    targetMouseX = (e.clientX / Math.max(1, W) - 0.5) * 2;
    targetMouseY = (e.clientY / Math.max(1, H) - 0.5) * 2;
  });

  const PALETTE = ["#60efff", "#6b8aff", "#a855f7", "#c084fc", "#f472b6", "#fbbf24", "#ffffff"];

  // 3D Warp Stars (high speed during Act 1 ignition & Act 5 handoff!)
  const warpStars = Array.from({ length: 130 }, () => ({
    x: (Math.random() - 0.5) * 2.2,
    y: (Math.random() - 0.5) * 2.2,
    z: Math.random() * 1.4 + 0.1,
    color: PALETTE[Math.floor(Math.random() * PALETTE.length)]
  }));

  // Upward Anti-Gravity Dust
  const dust = Array.from({ length: 155 }, () => ({
    x: Math.random() * 1920,
    y: Math.random() * 1080,
    r: Math.random() * 2.1 + 0.55,
    vy: -(Math.random() * 0.85 + 0.22),
    vx: (Math.random() - 0.5) * 0.28,
    color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
    phase: Math.random() * Math.PI * 2,
    isStar: Math.random() < 0.25
  }));

  // Orbiting 4-Point Gemini Crystal Sparkles around outer aura
  const orbiters = Array.from({ length: 16 }, (_, i) => ({
    angle: (i / 16) * Math.PI * 2,
    rx: 270 + (i % 4) * 66,
    ry: 160 + (i % 3) * 52,
    tilt: -0.22 + (i % 2) * 0.15,
    speed: (0.30 + (i % 5) * 0.08) * (i % 2 === 0 ? 1 : -0.72),
    size: 6.5 + (i % 4) * 4.2,
    color: PALETTE[i % (PALETTE.length - 1)]
  }));

  // Shooting Meteors across cosmic sky
  const meteors = Array.from({ length: 5 }, (_, i) => ({
    x: Math.random() * 1920,
    y: Math.random() * 400,
    vx: 620 + Math.random() * 380,
    vy: 210 + Math.random() * 150,
    len: 110 + Math.random() * 90,
    color: i % 2 === 0 ? "#60efff" : "#f472b6",
    cooldown: 1.8 + i * 1.15
  }));

  function drawFourPointStar(ctx, x, y, r, rot, color, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = r * 2.1;
    ctx.beginPath();
    const inner = r * 0.20;
    for (let i = 0; i < 8; i++) {
      const ang = (i * Math.PI) / 4;
      const rad = i % 2 === 0 ? r : inner;
      const px = Math.cos(ang) * rad;
      const py = Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Natural Live2D blink envelope (three crisp blinks across Act 4 showcase)
  function evalBlink(t) {
    const blinks = [6.25, 7.85, 9.35, 11.10];
    let v = 0;
    for (const bt of blinks) {
      const dt = t - bt;
      if (dt >= 0 && dt <= 0.22) {
        const s = Math.sin((dt / 0.22) * Math.PI);
        v = Math.max(v, s * s);
      }
    }
    return v;
  }

  // Cute snappy cat-ear twitch envelope
  function evalTwitch(t, times) {
    let v = 0;
    for (const tt of times) {
      const dt = t - tt;
      if (dt >= 0 && dt <= 0.28) {
        v = Math.max(v, Math.sin((dt / 0.28) * Math.PI * 2.0) * Math.exp(-dt * 4.5));
      }
    }
    return v;
  }

  let startTs = performance.now();
  let lastTs = startTs;
  let handingOff = false;
  let handoffTs = 0;

  function render(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastTs) / 1000));
    lastTs = now;
    const t = snapshotTime > 0 ? snapshotTime : (now - startTs) / 1000;

    mouseX += (targetMouseX - mouseX) * 0.08;
    mouseY += (targetMouseY - mouseY) * 0.08;
    hudLeft.style.transform = `translate3d(${(-mouseX * 7).toFixed(1)}px, calc(-50% + ${(-mouseY * 5).toFixed(1)}px), 0)`;

    bgCtx.clearRect(0, 0, W, H);
    fxCtx.clearRect(0, 0, W, H);

    // 1. 3D Warp Star Tunnel (blazing fast in Act 1 & Act 5, gentle cruise in Act 3-4)
    const warpSpeed = handingOff ? 2.8 : (t < 1.75 ? 1.85 : (t < 4.1 ? 0.95 : 0.25));
    for (const s of warpStars) {
      s.z -= dt * warpSpeed;
      if (s.z <= 0.05) {
        s.z = 1.45;
        s.x = (Math.random() - 0.5) * 2.2;
        s.y = (Math.random() - 0.5) * 2.2;
      }
      const px = W * 0.5 + (s.x / s.z) * W * 0.46;
      const py = H * 0.5 + (s.y / s.z) * H * 0.46;
      const prevZ = s.z + dt * warpSpeed * 3.4;
      const ox = W * 0.5 + (s.x / prevZ) * W * 0.46;
      const oy = H * 0.5 + (s.y / prevZ) * H * 0.46;
      const a = Math.min(0.85, (1.45 - s.z) * 0.72) * (t < 1.3 || handingOff ? 1.0 : 0.48);
      bgCtx.save();
      bgCtx.strokeStyle = s.color;
      bgCtx.globalAlpha = a;
      bgCtx.lineWidth = Math.max(0.8, (1.5 - s.z) * 1.9);
      bgCtx.beginPath();
      bgCtx.moveTo(ox, oy);
      bgCtx.lineTo(px, py);
      bgCtx.stroke();
      bgCtx.restore();
    }

    // 2. Upward-Floating Anti-Gravity Stardust
    for (const p of dust) {
      p.y += p.vy * (handingOff ? 4.2 : 1.0);
      p.x += p.vx + Math.sin(t * 0.9 + p.phase) * 0.18;
      if (p.y < -14) { p.y = H + 14; p.x = Math.random() * W; }
      if (p.x < -14) p.x = W + 14;
      if (p.x > W + 14) p.x = -14;

      const twinkle = 0.40 + 0.60 * Math.sin(t * 2.8 + p.phase);
      const alpha = Math.min(1, t * 0.9) * twinkle * 0.85;
      if (p.isStar) {
        drawFourPointStar(bgCtx, p.x % (W + 24), p.y, p.r * 2.5, t * 0.7 + p.phase, p.color, alpha);
      } else {
        bgCtx.save();
        bgCtx.globalAlpha = alpha;
        bgCtx.fillStyle = p.color;
        bgCtx.shadowColor = p.color;
        bgCtx.shadowBlur = 9;
        bgCtx.beginPath();
        bgCtx.arc(p.x % (W + 24), p.y, p.r, 0, Math.PI * 2);
        bgCtx.fill();
        bgCtx.restore();
      }
    }

    // 3. Orbital Astrolabe Rings behind Live2D Catgirl
    const cx = W * 0.64;
    const cy = H * 0.50;
    const ringAlpha = Math.max(0, Math.min(0.32, (t - 4.05) * 0.45));
    if (ringAlpha > 0) {
      bgCtx.save();
      bgCtx.translate(cx, cy);
      bgCtx.rotate(-0.18 + t * 0.055);
      bgCtx.strokeStyle = "rgba(96, 239, 255, " + ringAlpha.toFixed(3) + ")";
      bgCtx.lineWidth = 1.2;
      bgCtx.setLineDash([7, 10]);
      bgCtx.beginPath();
      bgCtx.ellipse(0, 0, Math.min(W, H) * 0.40, Math.min(W, H) * 0.17, 0, 0, Math.PI * 2);
      bgCtx.stroke();

      bgCtx.rotate(0.42 - t * 0.085);
      bgCtx.strokeStyle = "rgba(244, 114, 182, " + (ringAlpha * 0.82).toFixed(3) + ")";
      bgCtx.setLineDash([3, 13]);
      bgCtx.beginPath();
      bgCtx.ellipse(0, 0, Math.min(W, H) * 0.47, Math.min(W, H) * 0.22, 0, 0, Math.PI * 2);
      bgCtx.stroke();
      bgCtx.restore();
    }

    // 4. WebGL Live2D Moving Gemini Catgirl Render!
    if (glReady && gl && glProg) {
      gl.useProgram(glProg);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1i(glUniforms.uTex, 0);
      gl.uniform2f(glUniforms.uRes, heroGlCanvas.width, heroGlCanvas.height);
      gl.uniform2f(glUniforms.uImgRes, imgW, imgH);
      gl.uniform1f(glUniforms.uTime, t);
      gl.uniform1f(glUniforms.uBlink, evalBlink(t));
      gl.uniform1f(glUniforms.uEarTwitchL, evalTwitch(t, [5.85, 7.45, 9.05, 10.60]));
      gl.uniform1f(glUniforms.uEarTwitchR, evalTwitch(t, [5.94, 7.54, 9.14, 10.70]));
      gl.uniform2f(glUniforms.uMouse, mouseX, mouseY);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    // 5. Foreground Orbiting Gemini Crystal Stars + Shooting Meteors
    const fxAlpha = Math.max(0, Math.min(1, (t - 4.85) * 0.95));
    if (fxAlpha > 0) {
      const scale = Math.min(W / 1440, H / 810);
      for (const o of orbiters) {
        const a = o.angle + t * o.speed;
        const lx = Math.cos(a) * o.rx * scale;
        const ly = Math.sin(a) * o.ry * scale;
        const px = cx + lx * Math.cos(o.tilt) - ly * Math.sin(o.tilt) + mouseX * 14;
        const py = cy + lx * Math.sin(o.tilt) + ly * Math.cos(o.tilt) + mouseY * 10;
        const depth = (Math.sin(a) + 1) * 0.5;
        if (depth > 0.30) {
          const pulse = 0.72 + 0.28 * Math.sin(t * 4.5 + o.angle);
          drawFourPointStar(
            fxCtx, px, py,
            o.size * scale * (0.65 + 0.52 * depth) * pulse,
            t * 1.1 + o.angle,
            o.color,
            fxAlpha * (0.48 + 0.52 * depth)
          );
        }
      }

      // Twin Heterochromia Awakening Eye Star-Flare right when she reveals (t = 5.35s - 6.60s)
      if (t >= 5.35 && t <= 6.60) {
        const ft = Math.sin(((t - 5.35) / 1.25) * Math.PI);
        // Compute approximate screen pos of her eyes matching cover(0.62, 0.50)
        const sAspect = W / Math.max(1, H);
        const iAspect = imgW / Math.max(1, imgH);
        const mapUv = (u, v) => {
          let sx = u, sy = v;
          if (sAspect > iAspect) sy = (v - 0.5) * (sAspect / iAspect) + 0.5;
          else sx = (u - 0.62) * (iAspect / sAspect) + 0.62;
          return [sx * W, sy * H];
        };
        const [ex1, ey1] = mapUv(0.647, 0.219);
        const [ex2, ey2] = mapUv(0.684, 0.205);
        drawFourPointStar(fxCtx, ex1, ey1, 22 * ft * scale, t * 2.2, "#f472b6", ft * 0.92);
        drawFourPointStar(fxCtx, ex2, ey2, 22 * ft * scale, -t * 2.2, "#fbbf24", ft * 0.92);
      }
    }

    // Shooting Meteors
    for (const m of meteors) {
      if (t < m.cooldown) continue;
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if (m.x - m.len > W || m.y - m.len > H) {
        m.x = -120 + Math.random() * W * 0.55;
        m.y = -60 + Math.random() * H * 0.28;
        m.cooldown = t + 1.2 + Math.random() * 2.4;
        continue;
      }
      const grad = fxCtx.createLinearGradient(m.x, m.y, m.x - m.len, m.y - m.len * (m.vy / m.vx));
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.25, m.color);
      grad.addColorStop(1, "transparent");
      fxCtx.save();
      fxCtx.strokeStyle = grad;
      fxCtx.lineWidth = 2.0;
      fxCtx.globalAlpha = 0.78;
      fxCtx.beginPath();
      fxCtx.moveTo(m.x, m.y);
      fxCtx.lineTo(m.x - m.len, m.y - m.len * (m.vy / m.vx));
      fxCtx.stroke();
      fxCtx.restore();
    }

    // 6. Handoff Star-Gate Expanding Ring
    if (handingOff) {
      const ht = (now - handoffTs) / 1000;
      const prog = Math.min(1, ht / 0.54);
      const rad = prog * Math.hypot(W, H) * 0.76;
      fxCtx.save();
      fxCtx.strokeStyle = "rgba(96, 239, 255, " + ((1 - prog) * 0.90).toFixed(3) + ")";
      fxCtx.lineWidth = 3.5 * (1 - prog) + 0.5;
      fxCtx.shadowColor = "#a855f7";
      fxCtx.shadowBlur = 28;
      fxCtx.beginPath();
      fxCtx.arc(W * 0.5, H * 0.5, rad, 0, Math.PI * 2);
      fxCtx.stroke();
      fxCtx.restore();
    }

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // Sync the 3-view character cards sequentially
  [0, 1, 2].forEach((idx) => {
    setTimeout(() => {
      const el = document.getElementById("vc" + idx);
      if (el) el.classList.add("synced");
    }, 6750 + idx * 450);
  });

  // Telemetry & Backend Bridge
  const statusEl = document.getElementById("statusText");
  const percentEl = document.getElementById("percentText");
  const fillEl = document.getElementById("progressFill");
  const metaRightEl = document.getElementById("metaRight");
  const lockFrame = document.getElementById("lockFrame");
  const lockTag = document.getElementById("lockTag");
  const stageEl = document.getElementById("stage");
  const flashEl = document.getElementById("handoffFlash");

  let currentPct = 12;
  function setProgress(pct, text, meta) {
    currentPct = Math.max(currentPct, Math.min(100, pct));
    fillEl.style.width = currentPct + "%";
    percentEl.textContent = Math.round(currentPct) + "%";
    if (text) statusEl.textContent = text;
    if (meta) metaRightEl.textContent = meta;
  }

  setTimeout(() => setProgress(28, "01 // 异色瞳星轨觉醒中...", "CUT-IN AWAKENING"), 1800);
  setTimeout(() => setProgress(56, "02 // Live2D 神经骨骼同步完成...", "LIVE2D RIG: 60FPS"), 5000);
  setTimeout(() => setProgress(80, "03 // 正在对接 Antigravity 主工作区...", "SCANNING HWND..."), 6900);

  window.onBootProgress = function(pct, text, meta) {
    setProgress(pct, text, meta);
  };

  window.onWindowLocked = function(rect) {
    setProgress(96, "04 // 已锁定 Antigravity 界面坐标 · 即将无缝切入",
      rect ? ("LOCKED [" + rect.w + "×" + rect.h + "]") : "LOCKED");
    if (rect && rect.w > 200 && rect.h > 200) {
      lockFrame.style.left = Math.max(0, rect.x) + "px";
      lockFrame.style.top = Math.max(0, rect.y) + "px";
      lockFrame.style.width = Math.min(window.innerWidth, rect.w) + "px";
      lockFrame.style.height = Math.min(window.innerHeight, rect.h) + "px";
      lockTag.textContent = "ANTIGRAVITY LOCKED · " + rect.w + "×" + rect.h;
      lockFrame.classList.add("active");
    }
  };

  window.beginHandoff = function() {
    if (handingOff) return;
    handingOff = true;
    handoffTs = performance.now();
    setProgress(100, "04 // 星门展开 · 无缝切入 Antigravity", "HANDOFF ACTIVE");
    playHandoffPing();
    flashEl.classList.add("bloom");
    stageEl.classList.add("handoff");
    setTimeout(() => flashEl.classList.remove("bloom"), 240);
  };

  function requestSkip() {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.request_skip) {
      window.pywebview.api.request_skip();
    } else {
      window.beginHandoff();
      setTimeout(() => {
        stageEl.style.opacity = "0";
        stageEl.style.transition = "opacity 0.5s ease";
        setTimeout(() => {
          document.getElementById("replayBtn").style.display = "block";
        }, 520);
      }, 120);
    }
  }

  document.addEventListener("click", (e) => {
    if (e.target && e.target.id === "replayBtn") return;
    requestSkip();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" || e.key === " " || e.key === "Enter") {
      requestSkip();
    }
  });

  if (snapshotTime > 0) {
    // Jump CSS animations directly to requested timestamp (in seconds) for verification screenshots
    const ms = snapshotTime * 1000;
    document.querySelectorAll("*").forEach((el) => {
      const anims = el.getAnimations ? el.getAnimations() : [];
      anims.forEach((a) => { try { a.currentTime = ms; } catch (_) {} });
    });
    if (snapshotTime >= 4.0) {
      [0, 1, 2].forEach((idx) => {
        const el = document.getElementById("vc" + idx);
        if (el) el.classList.add("synced");
      });
      setProgress(92, "03 // 已锁定 Antigravity 界面坐标 · 准备衔接", "LOCKED [1920×1080]");
    }
  } else {
    setTimeout(() => {
      if (!(window.pywebview && window.pywebview.api)) {
        window.onWindowLocked({ x: 24, y: 24, w: window.innerWidth - 48, h: window.innerHeight - 48 });
        setTimeout(() => requestSkip(), 900);
      }
    }, 10400);
  }
})();
</script>
</body>
</html>
